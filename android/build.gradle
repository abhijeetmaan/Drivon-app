allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
// Do not use evaluationDependsOn(':app'): it forces plugins (e.g. sensors_plus) to
// evaluate before Flutter injects android { flutter.* } and breaks compileSdk.

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
